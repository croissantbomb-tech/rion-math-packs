<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리온 수학 팩 보관소</title><style>body{font:17px/1.7 system-ui;max-width:800px;margin:auto;padding:32px;background:#fafbf6;color:#263b37}a{color:#28725e}article{background:white;border:1px solid #dce3d9;border-radius:16px;padding:20px;margin:16px 0}code{overflow-wrap:anywhere}button,a{min-height:44px}h1{line-height:1.3}</style><h1>리온 수학 팩 보관소</h1><p>새 팩을 올리면 목록이 자동으로 만들어지고 콘솔에서 내려받을 수 있어요.</p><p><a href="https://github.com/croissantbomb-tech/rion-math-packs/upload/main/uploads">새 팩 올리기 ↗</a> · <a href="https://github.com/croissantbomb-tech/rion-math-packs/actions">배포 진행 확인 ↗</a></p><p>콘솔의 보호자 관리 → 콘텐츠 목록 주소에 아래 주소를 넣으세요.</p><code id="address"></code><p>웹 ZIP은 manifest.json을 포함합니다. 기존 JS 팩은 같은 이름의 .json 설명 파일을 함께 올려 주세요. 업데이트는 같은 ID의 버전을 올려서 배포합니다. GitHub 업로드 후 Commit changes로 저장해야 반영됩니다.</p><main id="packs" aria-live="polite">목록을 불러오는 중…</main><script>document.querySelector('#address').textContent=new URL('catalog.json',location.href).href;fetch('./catalog.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(c=>{const root=document.querySelector('#packs');root.textContent='';for(const p of c.packs){const card=document.createElement('article'),h=document.createElement('h2'),text=document.createElement('p'),a=document.createElement('a');h.textContent=(p.icon||'🧩')+' '+p.title;text.textContent='v'+p.version+' · '+p.size;a.textContent='팩 다운로드';a.href=p.bundleUrl;card.append(h,text,a);root.append(card)}}).catch(()=>document.querySelector('#packs').textContent='목록을 불러오지 못했어요. 배포 상태를 확인해 주세요.');</script></html>
